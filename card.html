<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khoj Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf7f0;color:#1f2a44;font:18px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.hero{height:min(60vw,300px);border-radius:18px;background:#e9e3d4 center/cover}
.badge{display:inline-block;background:#e3f4ea;color:#1f7a4d;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;margin-top:14px}
h1{margin:6px 0 0;font-size:1.8rem;line-height:1.2}.city{color:#5d6477;margin:0 0 14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.g img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
dl{background:#fff;border:1px solid #d9d2c3;border-radius:12px;padding:10px 14px;margin:0 0 14px}
dt{font-weight:600;font-size:.85rem;color:#5d6477;text-transform:capitalize}dd{margin:0 0 8px}
a.b{display:block;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:600;margin-top:10px}
.wa{background:#1f9d55;color:#fff}.call{background:#fff;color:#243b8f;border:2px solid #243b8f}
.err{color:#b3261e;font-weight:600}.f{margin-top:22px;text-align:center;color:#5d6477;font-size:.85rem}
</style>
</head>
<body>
<main id="m"><p>Loading...</p></main>
<script>
// Reads /b/{slug}.json from the backend and draws the Khoj Card.
const API_BASE = location.protocol === "file:" ? "http://localhost:8000" : "";
const slug = new URLSearchParams(location.search).get("slug");
const m = document.getElementById("m");
const el = (t, props={}, kids=[]) => { const e = Object.assign(document.createElement(t), props); kids.forEach(k => e.append(k)); return e; };
const photoUrl = f => /^https?:/.test(f) ? f : API_BASE + "/uploads/" + encodeURIComponent(f);

// Works with both backend shapes: /b/{slug}.json (name, photos[], bins) and /b/{slug} (business_name, photos[{filename}], facts)
async function getShop(){
  const e = encodeURIComponent(slug);
  let r = await fetch(API_BASE + "/b/" + e + ".json");
  if(!r.ok) r = await fetch(API_BASE + "/b/" + e);
  if(!r.ok) throw new Error(r.status === 404 ? "Shop not found." : "Server said " + r.status);
  const d = await r.json();
  if(d.message && !d.name && !d.business_name) throw new Error("Shop not found.");
  return d;
}
function normalize(d){
  return { name: d.name || d.business_name || "", city: d.city || "", phone: d.phone || "",
           photos: (d.photos || []).map(p => typeof p === "string" ? p : p.filename).filter(Boolean),
           bins: d.bins || d.facts || {} };
}
async function load(){
  if(!slug){ m.replaceChildren(el("p",{className:"err",textContent:"No shop selected. Add ?slug=your-shop to the address."})); return; }
  try{ draw(normalize(await getShop())); }
  catch(e){ m.replaceChildren(el("p",{className:"err",textContent:"Could not load this shop. " + e.message})); }
}
function draw(s){
  document.title = s.name + " - Khoj Card";
  const photos = (s.photos || []).map(photoUrl);
  const tel = String(s.phone || "").replace(/\D/g,"");
  const kids = [];
  const hero = el("div",{className:"hero"});
  if(photos[0]) hero.style.backgroundImage = "url('" + photos[0] + "')";
  kids.push(hero, el("span",{className:"badge",textContent:"Verified by merchant"}),
            el("h1",{textContent:s.name}), el("p",{className:"city",textContent:s.city || ""}));
  if(photos.length > 1) kids.push(el("div",{className:"g"}, photos.slice(1).map(u => el("img",{src:u,alt:""}))));
  const bins = s.bins && typeof s.bins === "object" ? Object.entries(s.bins) : [];
  if(bins.length){
    const dl = el("dl");
    bins.forEach(([k,v]) => dl.append(el("dt",{textContent:k}), el("dd",{textContent: typeof v === "object" ? JSON.stringify(v) : String(v)})));
    kids.push(dl);
  }
  if(tel){
    kids.push(el("a",{className:"b wa",href:"https://wa.me/91" + tel,textContent:"Message on WhatsApp"}),
              el("a",{className:"b call",href:"tel:+91" + tel,textContent:"Call " + s.phone}));
  }
  kids.push(el("p",{className:"f",textContent:"Khoj Card by Khoj Doot"}));
  m.replaceChildren(...kids);
}
load();
</script>
</body>
</html>
